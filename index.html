<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./imgs/question-sign.ico" type="image/x-icon">
    <title>FAQ</title>
</head>

<body>



    <header>
        <a href="#">FAQ</a>
        <a href="https://github.com/Amermob?tab=repositories">More Projects?</a>
    </header>


    <main>
        <h2>Frequently Asked Questions</h2>
        <div class="container">

            <div class="box arrow-1">
                <h2>what is the best GPU?</h2>
                <svg class="arrow arrow-1 down-1" data-set="special" xmlns="http://www.w3.org/2000/svg" height="24px"
                    viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                    <path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z" />
                </svg>
            </div>
            <p class="p-1 p">RX 9070 XT</p>
            <div class="box arrow-2">
                <h2>what is the best gaming cpu?</h2>
                <svg class="arrow arrow-2  down-2" xmlns="http://www.w3.org/2000/svg" height="24px"
                    viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                    <path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z" />
                </svg>
            </div>
            <p class="p-2 p">Ryzen 7 9800X3D</p>
            <div class="box arrow-3">
                <h2>what is the best resolution for a monitor?</h2>
                <svg class="arrow arrow-3 down-3" xmlns="http://www.w3.org/2000/svg" height="24px"
                    viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                    <path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z" />
                </svg>
            </div>
            <p class="p-3 p">1440P</p>
        </div>
    </main>

    <footer>
        &copy; <span id="date"></span> Amer
    </footer>

    <script src="main.js"></script>
</body>

</html>
